<!DOCTYPE html>
<html lang="PT.BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio aula 25</title>
</head>
<body>
<script> 
const nome = prompt('Digite seu nome:');

const resultado = `
<p>O seu nome é: <strong>${nome}</strong></p>
<p>Seu nome tem <strong>${nome.length}</strong> letras</p>
<p>A segunda letra do seu nome é: <strong>${nome[1]}</strong></p>
<p>Qual o primeiro índice da letra "g" no seu nome? <strong>${nome.indexOf('g')}</strong></p>
<p>Qual o último índice da letra "s" no seu nome? <strong>${nome.lastIndexOf('s')}</strong></p>
<p>As últimas 3 letras do seu nome são: <strong>${nome.slice(-3)}</strong></p>
<p>As palavras do seu nome são: <strong>${nome.split(' ')}</strong></p>
<p>Seu nome com letras maiúsculas: <strong>${nome.toUpperCase()}</strong></p>
<p>Seu nome com letras minúsculas: <strong>${nome.toLowerCase()}</strong></p>
`;

document.body.innerHTML = resultado;
</script>
    
    
</body>
</html>
